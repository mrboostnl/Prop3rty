<script>
function init_glowing_interactive_dots_grid() {
  document.querySelectorAll('[data-dots-container-init]').forEach(function (container) {
    if (container.hasAttribute('data-dots-done')) return;
    container.setAttribute('data-dots-done', '');
    var colors = { base: "#245E51", active: "#A8FF51" };
    var threshold = 200;
    var speed_threshold = 100;
    var shock_radius = 325;
    var shock_power = 5;
    var max_speed = 5000;
    var center_hole = false;
    var dots = [];
    var dot_centers = [];

    function build_grid() {
      container.innerHTML = "";
      dots = [];
      dot_centers = [];
      var style = getComputedStyle(container);
      var dot_px = parseFloat(style.fontSize);
      var gap_px = dot_px * 2;
      var cont_w = container.clientWidth;
      var cont_h = container.clientHeight;
      var cols = Math.floor((cont_w + gap_px) / (dot_px + gap_px));
      var rows = Math.floor((cont_h + gap_px) / (dot_px + gap_px));
      var total = cols * rows;
      var hole_cols = center_hole ? (cols % 2 === 0 ? 8 : 9) : 0;
      var hole_rows = center_hole ? (rows % 2 === 0 ? 4 : 5) : 0;
      var start_col = (cols - hole_cols) / 2;
      var start_row = (rows - hole_rows) / 2;
      for (var i = 0; i < total; i++) {
        var row = Math.floor(i / cols);
        var col = i % cols;
        var is_hole = center_hole && row >= start_row && row < start_row + hole_rows && col >= start_col && col < start_col + hole_cols;
        var d = document.createElement("div");
        d.classList.add("dot");
        if (is_hole) {
          d.style.visibility = "hidden";
          d._isHole = true;
        } else {
          gsap.set(d, { x: 0, y: 0, backgroundColor: colors.base });
          d._inertiaApplied = false;
        }
        container.appendChild(d);
        dots.push(d);
      }
      requestAnimationFrame(function () {
        var center_el = document.querySelector('.dots-center');
        if (center_el) {
          var cr = center_el.getBoundingClientRect();
          var pad = 16;
          dots.forEach(function (d) {
            var r = d.getBoundingClientRect();
            if (r.right > cr.left - pad && r.left < cr.right + pad && r.bottom > cr.top - pad && r.top < cr.bottom + pad) {
              d.style.visibility = 'hidden';
              d._isHole = true;
            }
          });
        }
        dot_centers = dots.filter(function (d) { return !d._isHole; }).map(function (d) {
          var r = d.getBoundingClientRect();
          return { el: d, x: r.left + window.scrollX + r.width / 2, y: r.top + window.scrollY + r.height / 2 };
        });
      });
    }

    window.addEventListener("resize", build_grid);
    build_grid();

    var last_time = 0, last_x = 0, last_y = 0;

    window.addEventListener("mousemove", function (e) {
      var now = performance.now();
      var dt = now - last_time || 16;
      var dx = e.pageX - last_x;
      var dy = e.pageY - last_y;
      var vx = dx / dt * 1000;
      var vy = dy / dt * 1000;
      var speed = Math.hypot(vx, vy);
      if (speed > max_speed) {
        var scale = max_speed / speed;
        vx *= scale; vy *= scale; speed = max_speed;
      }
      last_time = now;
      last_x = e.pageX;
      last_y = e.pageY;
      requestAnimationFrame(function () {
        dot_centers.forEach(function (item) {
          var el = item.el, x = item.x, y = item.y;
          var dist = Math.hypot(x - e.pageX, y - e.pageY);
          var t = Math.max(0, 1 - dist / threshold);
          gsap.set(el, { backgroundColor: gsap.utils.interpolate(colors.base, colors.active, t) });

            var push_y = (y - e.pageY) + vy * 0.005;
            gsap.to(el, {
              inertia: { x: push_x, y: push_y, resistance: 750 },
              onComplete: function () {
                gsap.to(el, { x: 0, y: 0, duration: 1.5, ease: "elastic.out(1,0.75)" });
                el._inertiaApplied = false;
              }
            });
          }
        });
      });
    });

    window.addEventListener("click", function (e) {
      dot_centers.forEach(function (item) {
        var el = item.el, x = item.x, y = item.y;
        var dist = Math.hypot(x - e.pageX, y - e.pageY);
        if (dist < shock_radius && !el._inertiaApplied) {

          var falloff = Math.max(0, 1 - dist / shock_radius);

          var push_y = (y - e.pageY) * shock_power * falloff;

              el._inertiaApplied = false;
            }
          });
        }
      });
    });
  });

<script>
(function () {
